# Configuración de la app de Cord en Shopify, como código.
#
# `shopify app config link` la enlazó (client_id); `shopify app deploy` empuja
# URLs, permisos y los webhooks de privacidad.
#
# Los webhooks de productos y clientes NO se declaran aquí: Shopify solo admite
# webhooks declarativos con instalación gestionada, que exige una app embebida,
# y Cord no lo es (la persona conecta su tienda desde Cord). Con el flujo
# clásico se registran por tienda al instalar, en `registrarWebhooks()`.
client_id = "140ab76a89855bc9b49703ba7f50115c"
name = "Cord"
application_url = "https://cordhq.app/api/integraciones/shopify/instalar"

# Cord NO vive dentro del panel de Shopify: la persona conecta su tienda desde
# Cord. Por eso no es embebida y usa el flujo clásico de autorización — la
# instalación gestionada con token exchange es solo para apps embebidas.
embedded = false

[access_scopes]
# Leer catálogo y clientes, y escribir el borrador de pedido que Cord crea al
# cerrar la venta. Cambiar esta línea obliga a que cada tienda ya conectada
# vuelva a autorizar: la tarjeta lo detecta y se lo pide, en vez de fallar.
scopes = "read_products,read_customers,write_draft_orders,read_orders"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://cordhq.app/api/integraciones/shopify/callback",
  # Desarrollo: Shopify admite localhost, y sin esto la tarjeta en la máquina de
  # quien programa solo puede mirarse, no probarse.
  "http://localhost:4321/api/integraciones/shopify/callback",
]

[webhooks]
api_version = "2026-07"

# Obligatorios para que Shopify revise la app. Cord los contesta siempre, aun
# sin conexión viva, y deja constancia en la auditoría de la organización.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://cordhq.app/api/integraciones/shopify/webhook"

[build]
