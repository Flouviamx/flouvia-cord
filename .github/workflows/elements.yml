name: Elements package

# Candado del paquete público @flouviahq/elements: tipos, build, exports
# congelados en api-report.json y resolución correcta en ESM/CJS. Solo corre
# cuando cambia el paquete o este archivo; la app la cubre cord-reliability.

on:
  pull_request:
    paths:
      - "packages/elements/**"
      - "packages/node/**"
      - "packages/cli/**"
      - "packages/python/**"
      - "packages/php/**"
      - "public/embed.js"
      - ".github/workflows/elements.yml"
  push:
    branches: [main]
    paths:
      - "packages/elements/**"
      - "packages/node/**"
      - "packages/cli/**"
      - "packages/python/**"
      - "packages/php/**"
      - "public/embed.js"
      - ".github/workflows/elements.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elements-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/elements

jobs:
  verify:
    name: Types, build and public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/elements/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Public exports match api-report.json
        run: npm run check-exports
      - name: public/embed.js matches the build
        run: npm run check-embed
      - name: Bundle size budget
        run: npm run check-size
      - name: Examples compile against the real SDK
        run: npx tsc -p examples/nextjs-app-router/tsconfig.json
      # Ambas herramientas están fijadas en devDependencies; npx usa esa versión.
      - name: Are the Types Wrong?
        run: npx --no-install attw --pack .
      - name: publint
        run: npx --no-install publint

  node-sdk:
    name: "@flouviahq/node: types, build and packaging"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Are the Types Wrong?
        run: npx --no-install attw --pack .
      - name: publint
        run: npx --no-install publint

  cli:
    name: "@flouviahq/cli: types and build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Smoke test
        run: node dist/cord.mjs --version && node dist/cord.mjs help

  python-sdk:
    name: "cord-sdk (Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build
        run: python -m pip install --quiet build && python -m build

  php-sdk:
    name: "flouviahq/cord (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: Lint
        run: for f in src/*.php tests/*.php; do php -l "$f"; done
      - name: Tests
        run: php tests/run.php
      - name: composer validate
        run: composer validate --strict --no-check-publish
