name: Cord crons

# Segundo reloj de los crons de Cord. El primero es `crons` en vercel.json.
#
# Por qué dos: el plan Hobby de Vercel solo admite crons DIARIOS (un `0 * * * *`
# ahí no es un cron que no corre, es un deployment RECHAZADO: pasó el 20 sep
# 2026), y Vercel no reintenta una corrida que falló. Este workflow recupera lo
# que Vercel no corrió y llama los endpoints que necesitan más de una corrida
# al día (workflows programados, recordatorio de tareas por zona horaria,
# reintentos de webhooks, envío a la AEAT).
#
# Qué llama: lo decide scripts/cron-schedule.mjs, que lee vercel.json. NO se
# compara la hora exacta: GitHub no corre el schedule a la hora pedida (del 1
# al 8 oct 2026 corrió 3-4 veces al día, a horas variables) y con hora exacta
# casi nunca coincidía. En cada corrida se llama todo endpoint cuya hora ya
# pasó hoy (UTC), los mensuales si su día ya pasó en el mes, y los "de cada
# corrida". Cada endpoint reclama su periodo en `cron_runs`
# (src/lib/cron-runs.ts): lo que ya corrió hoy responde `omitido` sin trabajar,
# y lo que quedó en error se reintenta. Que esto sea seguro depende de ese
# reclamo, no de que los endpoints "sean idempotentes" en general.
#
# Un endpoint que no responde 200 hace FALLAR el job (después de llamar a
# todos los demás): así GitHub avisa por correo en vez de dejar un warning que
# nadie lee. El periodo fallido se reintenta solo en la corrida siguiente.
#
# Requiere el secret del repositorio CRON_SECRET, con el mismo valor que la
# variable de entorno CRON_SECRET en Vercel.

on:
  schedule:
    # A los :10 de cada hora. No en punto: el minuto 0 es el más congestionado
    # de la cola de GitHub. Aun así GitHub corre esto cuando puede, no cada hora.
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Correr un solo endpoint (ej. api/cron/workflows). Vacío = los que tocan por horario.'
        required: false
        type: string
      force:
        description: 'Repetir el periodo aunque ya haya corrido (?force=1). Solo con un endpoint.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cord-crons
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: https://cordhq.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Los inputs viajan por entorno, nunca interpolados en el script.
      MANUAL: ${{ inputs.endpoint }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Verificar el secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret CRON_SECRET en el repositorio"
            exit 1
          fi

      # Solo la tabla y vercel.json: el script no tiene dependencias y usa el
      # Node que ya trae el runner.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron-schedule.mjs
            vercel.json
          sparse-checkout-cone-mode: false

      - name: Llamar los endpoints que tocan
        run: |
          set -u
          fallos=0
          llamar() {
            ruta="$1"
            # Una llamada puede durar lo que la función de Vercel (300 s).
            status=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 310 \
              -H "Authorization: Bearer $CRON_SECRET" "$BASE$ruta") || true
            echo "  $ruta → HTTP $status"
            head -c 400 /tmp/out.json 2>/dev/null || true
            echo
            if [ "$status" != "200" ]; then
              echo "::error::$ruta respondió ${status:-sin respuesta}"
              fallos=$((fallos + 1))
            fi
          }

          if [ -n "$MANUAL" ]; then
            ruta="/${MANUAL#/}"
            if ! printf '%s' "$ruta" | grep -Eq '^/api/(cron/[a-z0-9-]+|health)$'; then
              echo "::error::Endpoint inválido: $MANUAL"
              exit 1
            fi
            [ "$FORCE" = "true" ] && ruta="$ruta?force=1"
            echo "Corrida manual: $ruta"
            llamar "$ruta"
          else
            echo "Ahora: $(date -u +'%Y-%m-%d %H:%M') UTC"
            node scripts/cron-schedule.mjs --tabla
            rutas=$(node scripts/cron-schedule.mjs)
            for ruta in $rutas; do
              llamar "$ruta"
            done
          fi

          if [ "$fallos" -gt 0 ]; then
            echo "::error::$fallos endpoint(s) no respondieron 200; la siguiente corrida los reintenta"
            exit 1
          fi
