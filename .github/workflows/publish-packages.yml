name: Publish packages

# Publica @flouviahq/elements, @flouviahq/node y @flouviahq/cli con provenance: npm muestra que
# el paquete salió de este repo y de este commit, no de una laptop. Manual y
# solo desde main. Requiere el secreto NPM_TOKEN (granular, solo publish de
# @flouviahq) o trusted publishing configurado en npmjs.com.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Paquete a publicar"
        required: true
        type: choice
        options: [elements, node, cli, python, all]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      matrix:
        pkg: [elements, node, cli]
    steps:
      - uses: actions/checkout@v4
        if: inputs.package == matrix.pkg || inputs.package == 'all'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: inputs.package == matrix.pkg || inputs.package == 'all'
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/${{ matrix.pkg }}/package-lock.json
      - name: Install, verify and publish
        if: inputs.package == matrix.pkg || inputs.package == 'all'
        working-directory: packages/${{ matrix.pkg }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
          if [ "${{ matrix.pkg }}" != "cli" ]; then npx --no-install attw --pack . && npx --no-install publint; fi
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION ya está publicado; nada que hacer."
          else
            npm publish --provenance --access public
          fi

  publish-python:
    if: github.ref == 'refs/heads/main' && (inputs.package == 'python' || inputs.package == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m pip install --quiet build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
