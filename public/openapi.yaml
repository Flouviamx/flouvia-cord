{
  "openapi": "3.1.0",
  "info": {
    "title": "Cord API",
    "version": "2026-10-01",
    "description": "API pública de Cord. Toda respuesta viene en { data }; los errores, en { error, code, request_id, doc_url }. Generada desde src/lib/api-schema.ts."
  },
  "servers": [
    {
      "url": "https://cordhq.app/api/v1"
    }
  ],
  "security": [
    {
      "secretKey": []
    }
  ],
  "components": {
    "securitySchemes": {
      "secretKey": {
        "type": "http",
        "scheme": "bearer",
        "description": "sk_live_… o sk_test_…, solo desde tu servidor."
      },
      "publishableKey": {
        "type": "http",
        "scheme": "bearer",
        "description": "pk_live_… o pk_test_…, para el navegador; solo las operaciones marcadas."
      }
    },
    "schemas": {
      "ApiError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string",
            "description": "Mensaje legible."
          },
          "code": {
            "type": "string",
            "description": "Código estable para tu lógica."
          },
          "request_id": {
            "type": "string",
            "description": "Identificador de la petición; inclúyelo al pedir soporte."
          },
          "doc_url": {
            "type": "string",
            "description": "Documentación del código de error."
          }
        },
        "required": [
          "error",
          "code"
        ],
        "additionalProperties": {}
      }
    }
  },
  "paths": {
    "/me": {
      "get": {
        "operationId": "getMe",
        "summary": "Organización y alcance de la llave",
        "tags": [
          "Cuenta"
        ],
        "security": [
          {
            "secretKey": []
          }
        ],
        "parameters": [
          {
            "name": "Cord-Version",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2026-10-01"
              ]
            },
            "description": "Default: la versión fijada de tu llave."
          }
        ],
        "x-cord-scope": "read",
        "responses": {
          "200": {
            "description": "OK",
            "headers": {
              "Cord-Request-Id": {
                "schema": {
                  "type": "string"
                },
                "description": "Identificador de la petición; inclúyelo al pedir soporte."
              },
              "Cord-Version": {
                "schema": {
                  "type": "string"
                },
                "description": "Versión de la API con la que se respondió."
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "org": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "description": "Identificador (UUID)."
                            },
                            "nombre": {
                              "type": "string",
                              "description": "Nombre."
                            },
                            "plan": {
                              "type": "string",
                              "description": "Plan de Cord de la organización."
                            }
                          },
                          "required": [
                            "id",
                            "nombre",
                            "plan"
                          ],
                          "additionalProperties": {},
                          "description": "Organización dueña de la llave."
                        },
                        "scope": {
                          "type": "string",
                          "description": "read o write: lo que puede hacer la llave."
                        },
                        "mode": {
                          "type": "string",
                          "enum": [
                            "live",
                            "test"
                          ],
                          "description": "live o test: con test todo ocurre en la sandbox y no toca datos reales."
                        }
                      },
                      "required": [
                        "org",
                        "scope",
                        "mode"
                      ],
                      "additionalProperties": {},
                      "description": "Contenido de la respuesta o del evento."
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Petición inválida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "401": {
            "description": "Llave ausente, inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "403": {
            "description": "Sin permiso para esta operación",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "429": {
            "description": "Límite de peticiones; respeta Retry-After",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        }
      }
    },
    "/cotizaciones": {
      "get": {
        "operationId": "getCotizaciones",
        "summary": "Listar cotizaciones",
        "tags": [
          "Cotizaciones"
        ],
        "security": [
          {
            "secretKey": []
          }
        ],
        "parameters": [
          {
            "name": "Cord-Version",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2026-10-01"
              ]
            },
            "description": "Default: la versión fijada de tu llave."
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200
            },
            "description": "Resultados por página."
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 9007199254740991
            },
            "description": "Cuántos resultados saltar. Para recorrer listas grandes usa cursor: offset puede saltar o repetir registros si hay escrituras mientras paginas."
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "description": "Cursor de la página siguiente (meta.next_cursor). Con cursor se ignora offset: es estable aunque haya escrituras concurrentes."
            },
            "description": "Cursor opaco de la página siguiente; viene en meta.next_cursor."
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Estado de la cotización: draft, sent, viewed, approved, rejected, expired, paid o invoiced."
          },
          {
            "name": "folio",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Folio legible asignado por Cord, por ejemplo COT-0042."
          },
          {
            "name": "cliente_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "ID de un cliente del directorio."
          }
        ],
        "x-cord-scope": "read",
        "responses": {
          "200": {
            "description": "OK",
            "headers": {
              "Cord-Request-Id": {
                "schema": {
                  "type": "string"
                },
                "description": "Identificador de la petición; inclúyelo al pedir soporte."
              },
              "Cord-Version": {
                "schema": {
                  "type": "string"
                },
                "description": "Versión de la API con la que se respondió."
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {
                            "type": "string",
                            "description": "Identificador (UUID)."
                          },
                          "folio": {
                            "type": "string",
                            "description": "Folio legible asignado por Cord, por ejemplo COT-0042."
                          },
                          "cliente": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Cliente al que va dirigido: nombre de la empresa, o los datos para darlo de alta si no existe."
                          },
                          "status": {
                            "type": "string",
                            "description": "Estado de la cotización: draft, sent, viewed, approved, rejected, expired, paid o invoiced."
                          },
                          "total": {
                            "type": "number",
                            "description": "Importe en la divisa indicada por `moneda`."
                          },
                          "moneda": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Divisa ISO 4217."
                          },
                          "terminos": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Etiqueta legible del plazo en el idioma de la cuenta (\"Contado\", \"Net 45\"); para comparar usa terminos_codigo."
                          },
                          "terminos_codigo": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Código estable del plazo: contado o net<N> (net7, net15, net30, net45, net60, net90)."
                          },
                          "vigencia": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Fecha ISO 8601."
                          },
                          "creada": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Fecha ISO 8601."
                          },
                          "link_publico": {
                            "type": "string",
                            "description": "Link público absoluto de la cotización."
                          }
                        },
                        "required": [
                          "id",
                          "folio",
                          "cliente",
                          "status",
                          "total",
                          "moneda",
                          "terminos",
                          "terminos_codigo",
                          "vigencia",
                          "creada",
                          "link_publico"
                        ],
                        "additionalProperties": {}
                      },
                      "description": "Contenido de la respuesta o del evento."
                    },
                    "meta": {
                      "type": "object",
                      "properties": {
                        "limit": {
                          "type": "integer",
                          "description": "Resultados por página."
                        },
                        "offset": {
                          "type": [
                            "integer",
                            "null"
                          ],
                          "description": "Cuántos resultados saltar. Para recorrer listas grandes usa cursor: offset puede saltar o repetir registros si hay escrituras mientras paginas."
                        },
                        "total": {
                          "type": "integer",
                          "description": "Total con impuestos, en la divisa indicada por moneda."
                        },
                        "next_cursor": {
                          "type": [
                            "string",
                            "null"
                          ],
                          "description": "Cursor de la página siguiente; null si no hay más."
                        }
                      },
                      "required": [
                        "limit",
                        "offset",
                        "total",
                        "next_cursor"
                      ],
                      "description": "Paginación."
                    }
                  },
                  "required": [
                    "data",
                    "meta"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Petición inválida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "401": {
            "description": "Llave ausente, inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "403": {
            "description": "Sin permiso para esta operación",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "429": {
            "description": "Límite de peticiones; respeta Retry-After",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "postCotizaciones",
        "summary": "Crear cotización",
        "tags": [
          "Cotizaciones"
        ],
        "security": [
          {
            "secretKey": []
          },
          {
            "publishableKey": []
          }
        ],
        "parameters": [
          {
            "name": "Cord-Version",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2026-10-01"
              ]
            },
            "description": "Default: la versión fijada de tu llave."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 255
            },
            "description": "Reintento seguro: misma clave y mismo cuerpo, mismo resultado (24 h)."
          }
        ],
        "x-cord-scope": "write",
        "responses": {
          "200": {
            "description": "OK",
            "headers": {
              "Cord-Request-Id": {
                "schema": {
                  "type": "string"
                },
                "description": "Identificador de la petición; inclúyelo al pedir soporte."
              },
              "Cord-Version": {
                "schema": {
                  "type": "string"
                },
                "description": "Versión de la API con la que se respondió."
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string",
                          "description": "Identificador (UUID)."
                        },
                        "token": {
                          "type": "string",
                          "description": "Token del link público. Es una credencial: no lo publiques."
                        },
                        "folio": {
                          "type": "string",
                          "description": "Folio legible asignado por Cord, por ejemplo COT-0042."
                        },
                        "link_publico": {
                          "type": "string",
                          "description": "Link público absoluto que se comparte con el cliente."
                        },
                        "needs_approval": {
                          "type": "boolean",
                          "description": "true si quedó retenida esperando aprobación interna antes de enviarse."
                        },
                        "motivo": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Razón, escrita por una persona."
                        },
                        "email": {
                          "type": "object",
                          "properties": {
                            "sent": {
                              "type": "boolean",
                              "description": "true si el correo salió."
                            },
                            "skipped": {
                              "type": "string",
                              "description": "Por qué no se mandó el correo, si no salió."
                            }
                          },
                          "required": [
                            "sent"
                          ],
                          "additionalProperties": {},
                          "description": "Correo electrónico."
                        }
                      },
                      "required": [
                        "id",
                        "token",
                        "folio",
                        "link_publico",
                        "needs_approval",
                        "motivo"
                      ],
                      "additionalProperties": {},
                      "description": "Contenido de la respuesta o del evento."
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Petición inválida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "401": {
            "description": "Llave ausente, inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "403": {
            "description": "Sin permiso para esta operación",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          },
          "429": {
            "description": "Límite de peticiones; respeta Retry-After",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "items": {
                    "minItems": 1,
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "descripcion": {
                          "type": "string",
                          "description": "Descripción tal como la ve el cliente."
                        },
                        "cantidad": {
                          "type": "number",
                          "description": "Cantidad de unidades; admite decimales."
                        },
                        "precio_unitario": {
                          "type": "number",
                          "description": "Precio por unidad en la divisa del documento."
                        },
                        "precio_negociado": {
                          "type": "number",
                          "description": "Precio unitario final después de descuento; null si no hubo."
                        },
                        "costo_unitario": {
                          "type": "number",
                          "description": "Costo interno por unidad, para calcular margen. Nunca lo ve el cliente."
                        },
                        "producto_id": {
                          "type": "string",
                          "description": "ID de un producto del catálogo."
                        },
                        "tax_rate": {
                          "description": "Fracción 0–1, validada contra el catálogo de impuestos.",
                          "type": "number"
                        },
                        "exemption_reason": {
                          "description": "Solo España y solo en un concepto con tax_rate 0: causa de exención o no sujeción que declara Verifactu y cita la factura. Sin ella se deriva del cliente.",
                          "type": "string",
                          "enum": [
                            "E1",
                            "E2",
                            "E3",
                            "E4",
                            "E5",
                            "E6",
                            "N1",
                            "N2",
                            "S2"
                          ]
                        },
                        "clave_sat": {
                          "type": "string",
                          "description": "Solo México: clave de producto o servicio del SAT (c_ClaveProdServ, 8 dígitos) de este concepto. Gana sobre la del producto del catálogo; sin ninguna, el CFDI usa 01010101 (No existe en el catálogo). Fuera de México se ignora."
                        },
                        "clave_unidad_sat": {
                          "type": "string",
                          "description": "Solo México: clave de unidad del SAT (c_ClaveUnidad, como H87, E48 o HUR) de este concepto. Gana sobre la del producto; sin ninguna se deduce de la unidad del producto o se usa H87. Fuera de México se ignora."
                        }
                      },
                      "required": [
                        "descripcion",
                        "cantidad",
                        "precio_unitario"
                      ],
                      "additionalProperties": false
                    },
                    "description": "Líneas."
                  },
                  "cliente_id": {
                    "type": "string",
                    "description": "ID de un cliente del directorio."
                  },
                  "cliente": {
                    "type": "object",
                    "properties": {
                      "empresa": {
                        "type": "string",
                        "description": "Nombre de la empresa o persona."
                      },
                      "email": {
                        "type": "string",
                        "description": "Correo electrónico."
                      },
                      "contacto": {
                        "type": "string",
                        "description": "Nombre de la persona de contacto."
                      },
                      "telefono": {
                        "type": "string",
                        "description": "Teléfono con lada internacional."
                      },
                      "rfc": {
                        "type": "string",
                        "description": "Identificador fiscal: RFC, NIF, EIN…"
                      },
                      "fiscal": {
                        "type": "object",
                        "properties": {
                          "country": {
                            "type": "string",
                            "description": "País ISO 3166-1 alfa-2."
                          },
                          "tax_id": {
                            "type": "string",
                            "description": "Identificador fiscal: RFC en México, NIF/NIE/CIF en España, EIN en EE. UU."
                          },
                          "legal_name": {
                            "type": "string",
                            "description": "Razón social tal como aparece en la constancia fiscal, sin el régimen societario."
                          },
                          "regimen_fiscal": {
                            "type": "string",
                            "description": "Clave de régimen fiscal del SAT, por ejemplo 601 (México)."
                          },
                          "uso_cfdi": {
                            "type": "string",
                            "description": "Clave de uso de CFDI, por ejemplo G03 (México)."
                          },
                          "cp_fiscal": {
                            "type": "string",
                            "description": "Código postal del domicilio fiscal (México)."
                          }
                        },
                        "required": [
                          "country",
                          "tax_id"
                        ],
                        "additionalProperties": false,
                        "description": "Datos fiscales."
                      }
                    },
                    "required": [
                      "empresa"
                    ],
                    "additionalProperties": false,
                    "description": "Cliente al que va dirigido: nombre de la empresa, o los datos para darlo de alta si no existe."
                  },
                  "terminos": {
                    "type": "string",
                    "enum": [
                      "contado",
                      "net7",
                      "net15",
                      "net30",
                      "net45",
                      "net60",
                      "net90"
                    ],
                    "description": "Términos de pago: contado o net<N> (N días de crédito: 7, 15, 30, 45, 60 o 90)."
                  },
                  "vigencia_dias": {
                    "type": "integer",
                    "minimum": -9007199254740991,
                    "maximum": 9007199254740991,
                    "description": "Días que la cotización es válida desde su envío."
                  },
                  "notas": {
                    "type": "string",
                    "description": "Notas internas; el cliente no las ve."
                  },
                  "base_currency": {
                    "type": "string",
                    "description": "Divisa de venta ISO 4217: en la que se capturan los precios, se cobra y se factura. Default: la del negocio."
                  },
                  "fiscal_currency": {
                    "type": "string",
                    "description": "Divisa contable ISO 4217; si difiere de la de venta, la factura declara el tipo de cambio."
                  },
                  "iva_incluido": {
                    "type": "boolean",
                    "description": "true si los precios capturados ya incluyen el impuesto."
                  },
                  "send": {
                    "description": "Solo con Secret Key.",
                    "type": "boolean"
                  }
                },
                "required": [
                  "items"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/cotizaciones/{id}": {
      "get": {
        "operationId": "getCotizacionesById",
        "summary": "Detalle de cotización",
        "tags": [
          "Cotizaciones"
        ],
        "security": [
          {
            "secretKey": []
          }
        ],
        "parameters": [
          {
            "name": "Cord-Version",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2026-10-01"
              ]
            },
            "description": "Default: la versión fijada de tu llave."
          },
          {
            "name": "id",
